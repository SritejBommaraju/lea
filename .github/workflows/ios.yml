# Build and unit-test the iOS app on GitHub's macOS runner, so nobody needs a Mac to know whether a change compiles.
# `test` runs on every pull request and push touching ios/**. `archive` is manual (Actions tab > "iOS" > Run workflow,
# tick "archive") and needs the four Apple signing secrets; it produces an .ipa to install from Windows (ios/README.md,
# "Working from Windows (no Mac)"). Nothing here prints a secret; the temporary keychain is deleted at the end.
name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      archive:
        description: "Also build a signed .ipa (needs the APPLE_* repository secrets)"
        type: boolean
        default: false
      audit:
        description: "Screens job: also run Xcode's accessibility audit on the small phone at the largest text (adds about 10 minutes)"
        type: boolean
        default: false
      export_method:
        description: "Export method for the .ipa"
        type: choice
        options: [ad-hoc, app-store-connect, development]
        default: ad-hoc

permissions:
  contents: read

concurrency:
  # One run per branch: a push and the pull request it belongs to would otherwise both run, twice the macOS load.
  group: ios-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (MIT)

      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Metal toolchain (the app has .metal shaders)
        run: xcodebuild -downloadComponent MetalToolchain || echo "::warning::MetalToolchain download failed; continuing in case the image has it"

      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -E '^ +iPhone' | tail -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          test -n "$UDID" || { echo "no iPhone simulator on this image"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -project ios/RepairOS.xcodeproj -scheme RepairOS \
            -destination "id=${{ steps.sim.outputs.udid }}" -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            -resultBundlePath "$RUNNER_TEMP/RepairOS.xcresult" \
            build test 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Keep the result bundle and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 (MIT)
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/RepairOS.xcresult
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14

  # Screenshots of every screen, so the app can be looked at from Windows: the UI tests in ios/RepairOSUITests open each
  # screen in a fixed demo state on two simulators (the biggest and the smallest iPhone on the image), in light and
  # dark, and once at the largest accessibility text size. Runs beside `test`, never after it.
  screens:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (MIT)

      - name: Select the newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Metal toolchain (the app has .metal shaders)
        run: xcodebuild -downloadComponent MetalToolchain || echo "::warning::MetalToolchain download failed; continuing in case the image has it"

      - name: Pick the big and the small simulator
        run: |
          LIST=$(xcrun simctl list devices available)
          echo "$LIST"
          mkdir -p "$RUNNER_TEMP/screens"; echo "$LIST" > "$RUNNER_TEMP/screens/devices.txt"
          uuid() { grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1; }
          BIG=""
          for n in "iPhone 18 Pro" "iPhone 17 Pro" "iPhone 18" "iPhone 17" "iPhone 16 Pro"; do
            BIG=$(echo "$LIST" | grep -F " $n (" | uuid || true); [ -n "$BIG" ] && BIG_NAME="$n" && break
          done
          if [ -z "$BIG" ]; then BIG=$(echo "$LIST" | grep -E '^ +iPhone' | tail -1 | uuid || true); BIG_NAME="iPhone"; fi
          SMALL=""
          for n in "iPhone SE (3rd generation)" "iPhone 16e" "iPhone 17e" "iPhone 15" "iPhone 17"; do
            SMALL=$(echo "$LIST" | grep -F " $n (" | uuid || true); [ -n "$SMALL" ] && SMALL_NAME="$n" && break
          done
          test -n "$BIG" && test -n "$SMALL" || { echo "no iPhone simulators on this image"; exit 1; }
          label() { echo "$1" | tr -c 'A-Za-z0-9\n' '-' | sed 's/--*/-/g; s/-$//'; }
          echo "BIG=$BIG" >> "$GITHUB_ENV"
          echo "SMALL=$SMALL" >> "$GITHUB_ENV"
          echo "BIG_LABEL=$(label "$BIG_NAME")" >> "$GITHUB_ENV"
          echo "SMALL_LABEL=$(label "$SMALL_NAME")" >> "$GITHUB_ENV"
          echo "Big: $BIG_NAME ($BIG). Small: $SMALL_NAME ($SMALL)."

      - name: Boot both simulators now, so they have settled by the time the tests start
        run: |
          # The first test run on a simulator booted a moment earlier stalled for about nine minutes; booting during the build avoids it.
          xcrun simctl boot "$BIG" || true
          xcrun simctl boot "$SMALL" || true
          xcrun simctl bootstatus "$BIG" -b || true
          xcrun simctl bootstatus "$SMALL" -b || true

      - name: Build the app and the UI tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ios/RepairOS.xcodeproj -scheme RepairOSScreens \
            -destination "id=$BIG" -configuration Debug -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Take the screenshots
        env:
          AUDIT: ${{ inputs.audit && '1' || '0' }}
        run: |
          OUT="$RUNNER_TEMP/screens"; RES="$RUNNER_TEMP/results"
          mkdir -p "$OUT" "$RES"
          # udid device-label appearance text-size-name simctl-size audit
          run_config() {
            local udid="$1" label="$2" appearance="$3" text="$4" size="$5" audit="$6"
            local name="$label-$appearance-$text"
            echo "[$(date +%T)] start $name"
            xcrun simctl bootstatus "$udid" -b >/dev/null 2>&1 || xcrun simctl boot "$udid" || true
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            xcrun simctl ui "$udid" appearance "$appearance" || true
            xcrun simctl ui "$udid" content_size "$size" || true
            # A test runner that stalls while starting (seen on the first run after a cold boot) is stopped after 5 and a half minutes
            # and tried once more; a normal run takes 2 to 4 minutes.
            for attempt in 1 2; do
              rm -rf "$RES/$name.xcresult"
              env TEST_RUNNER_SCREENS_DEVICE="$label" TEST_RUNNER_SCREENS_APPEARANCE="$appearance" TEST_RUNNER_SCREENS_TEXT="$text"                   TEST_RUNNER_SCREENS_OUT="$OUT" TEST_RUNNER_SCREENS_AUDIT="$audit"                 xcodebuild test-without-building -project ios/RepairOS.xcodeproj -scheme RepairOSScreens                   -destination "id=$udid" -configuration Debug -derivedDataPath "$RUNNER_TEMP/dd"                   -resultBundlePath "$RES/$name.xcresult"                   CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" > "$RES/$name.log" 2>&1 &
              local pid=$!
              local waited=0
              # An audited run takes about 12 minutes by itself, so its limit is longer.
              limit=330; [ "$audit" = 1 ] && limit=1500
              while kill -0 "$pid" 2>/dev/null && [ "$waited" -lt "$limit" ]; do sleep 5; waited=$((waited + 5)); done
              if kill -0 "$pid" 2>/dev/null; then echo "$name: stopped after ${waited}s (attempt $attempt)"; pkill -P "$pid" || true; kill "$pid" || true; fi
              if wait "$pid"; then rm -f "$RES/$name.failed"; break; else touch "$RES/$name.failed"; echo "tests failed in $name (attempt $attempt)"; fi
              mv "$RES/$name.log" "$RES/$name.attempt$attempt.log" 2>/dev/null || true
            done
            echo "[$(date +%T)] done $name"
          }
          # The two phones run side by side; each walks its own appearances one after the other.
          ( run_config "$BIG" "$BIG_LABEL" light default large 0
            run_config "$BIG" "$BIG_LABEL" dark default large 0
            run_config "$BIG" "$BIG_LABEL" light text-xxxl accessibility-extra-extra-extra-large 0 ) &
          ( run_config "$SMALL" "$SMALL_LABEL" light default large 0
            run_config "$SMALL" "$SMALL_LABEL" dark default large 0
            run_config "$SMALL" "$SMALL_LABEL" light text-xxxl accessibility-extra-extra-extra-large "$AUDIT" ) &
          wait
          for f in "$RES"/*.log; do echo "::group::$(basename "$f")"; grep -E "Test Case .*(passed|failed)|error:|Executed|TEST (SUCCEEDED|FAILED)" "$f" | tail -40; echo "::endgroup::"; done
          echo "Screenshots: $(ls "$OUT"/*.png | wc -l)"
          xcrun simctl shutdown all || true
          ls "$RES"/*.failed >/dev/null 2>&1 && { echo "::error::some screens failed, see the logs above"; exit 1; }
          exit 0

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 (MIT)
        with:
          name: screens
          path: |
            ${{ runner.temp }}/screens
            ${{ runner.temp }}/results/*.log
          if-no-files-found: warn
          retention-days: 14

  archive:
    if: github.event_name == 'workflow_dispatch' && inputs.archive
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Signing secrets present
        run: |
          for n in APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!n}" ]; then echo "::error::repository secret $n is not set; see ios/README.md"; exit 1; fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (MIT)

      - name: Select the newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "::warning::MetalToolchain download failed; continuing"

      - name: Import certificate and profile into a temporary keychain
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Archive (Release, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild archive -project ios/RepairOS.xcodeproj -scheme RepairOS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/RepairOS.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Export the .ipa
        run: |
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$RUNNER_TEMP/RepairOS.xcarchive/Info.plist")
          /usr/libexec/PlistBuddy \
            -c 'Add :method string ${{ inputs.export_method }}' \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            -c 'Add :signingStyle string manual' \
            -c 'Add :provisioningProfiles dict' \
            -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" \
            "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/RepairOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"

      - name: Keep the .ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 (MIT)
        with:
          name: RepairOS-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Delete the temporary keychain and profile
        if: always()
        run: |
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
