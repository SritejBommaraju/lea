# RepairOS task registry. Machine-readable twin of BUILD.md §5 (cards) and §0 (the 24-hour plan).
# Source of truth for build/next.py, build/status.py and build/doctor.py.
#
# FORMAT (strict YAML subset, parsed by build/_lib.py without PyYAML):
#   - two-space indent, one key per line, `key: value`
#   - lists are flow lists `[a, b]` on one line, or block lists of `- item`
#   - strings containing ':' or '#' must be double-quoted; no anchors, no multi-line scalars
#
# CARD FIELDS (missing fields take the default in brackets)
#   id, title, phase                   required
#   kind: core | module                [core]   core = needed whatever providers are chosen; module = one slot implementation or a slot interface
#   slot: <SLOT id from config/providers.yaml>  (module cards only)
#   impl: <impl id> | interface        (module cards only; `interface` = the slot's interface + conformance suite card)
#   always: true | false               [false]  module impl card in play whatever is selected (the grain replay double for CI)
#   optional: true | false             [false]  extra work: tracked separately, never counts toward "done" or the critical path
#   stretch: true | false              [false]  demo stretch: only if the core path is done by ~H16; off the critical path
#   track: demo | later                [later]  demo = on the 24-hour path (BUILD.md §0); later = after the hackathon
#   phase1: true | false               [false]  Phase 1 = no Grain (BUILD.md Phases). Grain cards, cards with grain_needs and
#                                               anything depending on a Phase 2 card are Phase 2; next.py --phase1 filters
#   estimate_hours                     demo cards only, 0.25-4 (agent-assisted hours)
#   owner_lane: L1..L6                 demo cards only; see `lanes`
#   depends_on, owns, shared, contracts, human, questions, grain_needs   [ [] ]
#   estimate_days                      [1]  full-build estimate (track all)
#   status: todo | claimed | in_review | done | blocked   [todo]
#   claimed_by, issue, pr              [null]
#
# RULES
#   - Every card in BUILD.md §5 has exactly one entry here with the same id. CI (B0.3) checks they agree.
#   - A demo card never depends on a later card (validate_tasks fails). There are no fallback paths in the demo
#     (owner, 2026-10-24): the demo-critical Grain API capabilities (`private/grain/GRAIN_STATUS.md` §4 items 1-5,
#     ask Sritej) are demo cards S2.7-S2.11 that must land; `grain_needs` names the Grain target (T-number), the card
#     that lands it, or how we call Grain's API until a non-critical target lands (not a degraded mode).
#   - Nobody edits status per PR: a card whose id leads a commit subject on main counts as done (squash-merge keeps
#     the PR title; build/_lib.py merged_cards). Set `blocked` (with the reason in a comment) or `done` by hand only
#     when git cannot tell.
#   - `blocked` cards stay out of the ready list until someone sets them back to `todo`.
#   - `owns` globs of cards that run in parallel must be disjoint. `shared` files follow the shared-file rule (BUILD.md §0.4).
#   - `human` lists ids from `human_steps`. `questions` lists SPEC.md §11 ids (`decisions` below settles them for the
#     24 hours). `grain_needs` lists Grain API targets (T-numbers; `private/grain/GRAIN_STATUS.md` §2) and the card
#     that lands each.
#   - A module impl card is `done` only when it passes the slot's conformance suite on recorded real data.

version: 3
updated: 2026-10-24

phases:
  - id: P0
    name: "Bootstrap, codegen, CI, tooling, registry"
  - id: P1
    name: "Capture and real data"
  - id: P2
    name: "State layer, gateway, Grain, reference, align, render"
  - id: P3
    name: "Perception: detect, segment, OCR, wire check, compare"
  - id: P4
    name: "Fusion, next action, planner, Grain cross-check, pipeline"
  - id: P5
    name: "iOS: Mode B, AR, wizard, parts, plan UI"
  - id: P6
    name: "Parts on hand, shopping, assistant, plan, confirm"
  - id: P7
    name: "Training tier"
  - id: P8
    name: "Evaluation and generalisation gates"
  - id: P9
    name: "Observability, security, hosting, release, demo"

# Lanes of the 24-hour plan (BUILD.md §0.B). People are the starting assignment; the owner can reassign.
lanes:
  - id: L1
    name: "iOS capture: app shell, Mode A, dense point fusion + PLY, upload, Mode B stills, AR labels, Stray or Polycam converter (Q16)"
    people: "Elysi (with Sritej)"
  - id: L2
    name: "Backend + Grain client + align: state, gateway, blobs, Grain slot, reference cache, ICP, cross-check"
    people: "Rohan"
  - id: L3
    name: "Fusion and vision crops + Grain side: Jev, geometry compare, projection, crops; Grain-side API targets T1-T3, T7, T12-T13"
    people: "Sritej + Elysi (Sritej lands the Grain-side cards S2.7-S2.11)"
  - id: L4
    name: "Meter wizard + electrical: word state, next action, planner, range check, wizard UI, confirm"
    people: "Jayden"
  - id: L5
    name: "Parts, I have X, plan, assistant + VLM: LLM and VLM slots, datasheets, quick check, simulation check, plan writer"
    people: "Samik"
  - id: L6
    name: "Demo + integration: hour 0, scaffold, codegen, pipeline, findings UI, demo script, backup video"
    people: "Agents, coordinated by Sritej; Rohan runs the H0 scaffold cards; Samik + Jayden take the demo script and video from H16"

# Work streams (areas/README.md). One person runs each stream; lanes L1-L6 are aliases inside them.
# A card belongs to the FIRST stream whose `cards` globs match its id; `build` catches the rest.
# `python3 -I build/next.py --stream <id>` lists what is ready in a stream.
streams:
  - id: grain
    name: "Grain side (API capabilities RepairOS needs; Sritej)"
    file: "areas/README.md"
    people: "Sritej"
    lanes: [L3]
    cards: [S2.7, S2.8, S2.9, S2.10, S2.11]
  - id: modeling
    name: "Modeling + benchmark: perception slots, crops and compare, training, evaluation, real-data sets"
    file: "areas/modeling-benchmark.md"
    people: "one person (owner assigns)"
    lanes: [L3, L5, L6]
    cards: ["C1.8", "M.DET.*", "M.SEG.*", "M.OCRB.*", "M.VLM.*", "M.DEPTH.*", "M.RENDER.*", "V3.*", "M.TRAIN.*", "T7.*", "E8.*"]
  - id: app
    name: "App: the iOS app (capture Mode A/B, upload, AR labels, wizard, parts, plan and findings UI)"
    file: "areas/app.md"
    people: "one person (owner assigns)"
    lanes: [L1, L4, L5, L6]
    cards: ["C1.*", "I5.*", "M.OCRD.*", "M.SPEECH.*"]
  - id: build
    name: "Build-plan execution: scaffold, backend, Grain client, align, fusion, meter, parts, plan, pipeline, demo"
    file: "areas/build-execution.md"
    people: "Rohan (driving agents)"
    lanes: [L2, L3, L4, L5, L6]
    cards: ["*"]

# Open questions settled for the 24 hours (BUILD.md §0.C). The owner can overrule any of them.
# status.py and next.py treat a card's `questions` that appear here as decided, not as blockers.
decisions:
  - id: Q1
    text: "Demo product picked by the owner at H0: low-voltage DC, removable connector or harness, battery or USB supply on a clear power path, table-sized, ideally Grain-designed (else Grain designs a reference by chat at H0-H2, design_trust low). Two units if possible. Facts only in samples/."
  - id: Q2
    text: "RepairOS ICP is primary; Grain align=icp on the raw scan is the cross-check"
  - id: Q3
    text: "claude-sonnet-5-5 for assistant and plan text; claude-haiku-5-5 for crop yes/no, cannot_tell escalates to Sonnet; Anthropic key on the backend only"
  - id: Q4
    text: "Owner: Jev is the demo fusion engine (FUSION=jev). No rules fallback on the demo path; Jev down is a blocker to fix at once"
  - id: Q5
    text: "Grey band 0.35-0.65 asks Grain /look for a second opinion"
  - id: Q6
    text: "Upload dense points at <= 2 mm spacing, high-confidence pixels only, 0.3-0.5 m range, overlapping frames averaged per surface point; no coarse voxel averaging (G29). Checked on the first real capture at H6"
  - id: Q7
    text: "Reference cache on backend disk keyed by Grain project id + last_build (hash when T11 lands)"
  - id: Q8
    text: "Simulation-checked swap pre-run and cached before the demo"
  - id: Q9
    text: "RepairOS searches and ranks substitutes; Grain only checks (simulation check)"
  - id: Q10
    text: "On device: capture + Apple Vision OCR only; no Core ML"
  - id: Q11
    text: "Hi-res still size and formats answered by the 10-line device test in H0-H1 (C1.2)"
  - id: Q12
    text: "Start with 3 stills; ask for more only on insufficient_evidence"
  - id: Q13
    text: "insufficient_evidence then 'the meter proves it' is an acceptable demo beat"
  - id: Q14
    text: "A scan fits in 2 minutes"
  - id: Q15
    text: "One phone, free Apple ID signing, no TestFlight"
  - id: Q16
    text: "Fallback capture app: Polycam Developer Mode or Stray Scanner, whichever someone has; our app is primary"
  - id: Q17
    text: "No purchases; a ring light is optional"
  - id: Q18
    text: "Licence follow-ups after the hackathon; add no dependency outside Apache/MIT/BSD/CC-BY"
  - id: Q19
    text: "RunPod not used"
  - id: Q-S1
    text: "SpacetimeDB deferred with the STDB cards"
  - id: Q-S2
    text: "SpacetimeDB deferred with the STDB cards"
  - id: Q-S3
    text: "SpacetimeDB deferred with the STDB cards"
  - id: Q-S4
    text: "SpacetimeDB deferred with the STDB cards"
  - id: Q-G1
    text: "Feedback into predicted-beside-measured: later idea"
  - id: Q-G2
    text: "Made-part price: the pilot's print estimate for simple printed parts; otherwise 'no price'"

# Slots. `required: true` = the first working build needs one done implementation of this slot.
slots:
  - id: STATE
    name: "State layer: tables, reducers, job queue, live subscriptions"
    required: true
  - id: BLOB
    name: "Blob storage for scans, stills, crops, renders"
    required: true
  - id: GRAIN
    name: "Grain client (pinned interface version)"
    required: true
  - id: FUSION
    name: "Fusion engine (Jev)"
    required: true
  - id: LLM
    name: "Text LLM: assistant tool loop, plan text, extraction"
    required: true
  - id: VLM
    name: "Vision-language model for crop pairs"
    required: true
  - id: DET
    name: "Open-vocabulary detector (`none` in the hackathon profile)"
    required: true
  - id: SEG
    name: "Promptable segmenter (`none` in the hackathon profile)"
    required: true
  - id: OCRB
    name: "Backend OCR (`none` in the hackathon profile)"
    required: true
  - id: OCRD
    name: "On-device OCR"
    required: false
  - id: DEPTH
    name: "Depth refinement (optional)"
    required: false
  - id: RENDER
    name: "Expected-view renderer"
    required: true
  - id: SUPPLIER
    name: "Parts and supplier search for shopping"
    required: true
  - id: TRAIN
    name: "Training compute"
    required: false
  - id: HOST
    name: "Backend hosting and runtime"
    required: true
  - id: SPEECH
    name: "Speech input for meter readings"
    required: false

# Human steps. doctor.py checks `check` where it can; `how` is what the human does.
human_steps:
  - id: dev_tools
    what: "Python 3.12+, git, gh and Node 22+ on the dev machine"
    why: "Backend, codegen, CI and build tooling cards need these"
    how: "`brew install python@3.12 gh node@22` (or your package manager), then `gh auth login`"
    check: tools_core
  - id: xcode
    what: "Xcode 26.x with Swift 6.x and the iOS 26 SDK on the dev Mac"
    why: "Every iOS card builds with it"
    how: "Install Xcode from the App Store, open it once, run `xcode-select --install`, then `xcodebuild -version`"
    check: xcode
  - id: repo_access
    what: "Write access to the RepairOS GitHub repo; `gh auth status` ok"
    why: "Claiming a card = self-assigning its issue and opening a PR"
    how: "Ask the owner for collaborator access, then `gh auth login`"
    check: gh_auth
  - id: grain_key
    what: "Grain URL and key in backend/.env as GRAIN_URL and GRAIN_KEY"
    why: "Every Grain card builds against the real Grain API (GEN3). No mock server; recorded real responses for offline work."
    how: "Sritej starts Grain (private/grain/GRAIN_SPEC.md §2) and issues a RepairOS API key (sent as `Authorization: Bearer <key>`). GRAIN_URL = the Grain laptop's LAN URL or its tunnel URL (a quick tunnel changes on restart, G20). backend/.env only; never commit."
    check: env_grain
  - id: grain_project
    what: "The demo product's Grain project id (with model.glb, harness.csv, elec.json, bom) as GRAIN_TEST_PROJECT in backend/.env"
    why: "Contract tests and the reference cache need a real project to pull"
    how: "Owner picks at H0 (Q1). Until then use the test project Sritej names (the one behind the private fixtures in private/grain/observed/). Set GRAIN_TEST_PROJECT=<id> in backend/.env"
    check: env_grain_project
  - id: jev_key
    what: "TypeSafe (Jev) API key in backend/.env as TYPESAFE_KEY"
    why: "FUSION=jev calls hosted Jev in both profiles; it fuses evidence and picks the next action (A2). Needed at H0 (B0.11)"
    how: "Create a key in the TypeSafe console (docs.typesafe.ai); set TYPESAFE_KEY=... in backend/.env (backend only, never on the phone). Run tools/jev_smoke.py (B0.11)."
    check: env_jev
  - id: anthropic_key
    what: "ANTHROPIC_API_KEY in backend/.env"
    why: "LLM=anthropic and VLM=anthropic"
    how: "Q3 decided: the owner provides one backend-only key. Set ANTHROPIC_API_KEY=... in backend/.env. Never on the phone (A6)."
    check: env_anthropic
  - id: openai_key
    what: "OPENAI_API_KEY in backend/.env"
    why: "LLM=openai or VLM=openai"
    how: "Set OPENAI_API_KEY=... in backend/.env, or change LLM/VLM in config/providers.yaml"
    check: env_openai
  - id: openai_compatible_url
    what: "OPENAI_COMPATIBLE_URL (and optional key) in backend/.env for a self-hosted model server"
    why: "LLM=openai_compatible or VLM=qwen3vl"
    how: "Run vLLM or similar with an Apache-2.0 model; set OPENAI_COMPATIBLE_URL=http://host:port/v1 in backend/.env"
    check: env_openai_compatible
  - id: runpod
    what: "RunPod API key (RUNPOD_API_KEY in backend/.env) and a 50-100 GB network volume named repairos-data"
    why: "TRAIN=runpod (and HOST=docker_gpu on a RunPod pod)"
    how: "Owner creates the key at runpod.io; set RUNPOD_API_KEY=... in backend/.env; create the volume. Or change TRAIN in config/providers.yaml."
    check: env_runpod
  - id: modal_account
    what: "Modal account and `modal token set` done on this machine"
    why: "TRAIN=modal or HOST=modal"
    how: "Sign up at modal.com; `pip install modal`; `modal token new`"
    check: modal_cli
  - id: lambda_key
    what: "LAMBDA_API_KEY in backend/.env"
    why: "TRAIN=lambda"
    how: "Create a key at lambda.ai; set LAMBDA_API_KEY=... in backend/.env"
    check: env_lambda
  - id: spacetime_cli
    what: "The `spacetime` CLI installed (SpacetimeDB 2.13.x)"
    why: "STATE=spacetimedb: start a local server, publish the module, generate bindings"
    how: "Install per https://spacetimedb.com/install (macOS: `curl -sSf https://install.spacetimedb.com | sh`), then `spacetime --version`"
    check: spacetime_cli
  - id: spacetime_server
    what: "A reachable SpacetimeDB server: SPACETIMEDB_URL in backend/.env (local default http://127.0.0.1:3000) and SPACETIMEDB_DB name"
    why: "STATE=spacetimedb: workers, gateway and tests need a server"
    how: "Local: `spacetime start` in another terminal, set SPACETIMEDB_URL=http://127.0.0.1:3000 and SPACETIMEDB_DB=repairos in backend/.env. Maincloud: set STATE_TARGET: maincloud and SPACETIMEDB_URL=https://maincloud.spacetimedb.com"
    check: spacetime_server
  - id: spacetime_login
    what: "Logged in to Maincloud: `spacetime login`"
    why: "STATE_TARGET=maincloud: publishing needs a Clockwork account; the owner must also confirm the Maincloud terms (SPEC Q-S1)"
    how: "`spacetime login` (GitHub or Google). Check the plan limits at https://spacetimedb.com/pricing"
    check: spacetime_login
  - id: s3_credentials
    what: "S3-compatible endpoint and credentials in backend/.env (S3_ENDPOINT, S3_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)"
    why: "BLOB=s3"
    how: "Create a bucket; set the four variables in backend/.env; or keep BLOB: local"
    check: env_s3
  - id: nexar_key
    what: "NEXAR_CLIENT_ID and NEXAR_CLIENT_SECRET in backend/.env"
    why: "SUPPLIER=nexar"
    how: "Register at nexar.com; set the two variables; or keep SUPPLIER: bom_and_web"
    check: env_nexar
  - id: digikey_key
    what: "DIGIKEY_CLIENT_ID and DIGIKEY_CLIENT_SECRET in backend/.env"
    why: "SUPPLIER=digikey"
    how: "Register at developer.digikey.com; set the two variables"
    check: env_digikey
  - id: gpu_box
    what: "A Linux machine with an NVIDIA GPU (>= 16 GB) and Docker, reachable from the dev Mac (HOST_SSH in backend/.env)"
    why: "HOST=docker_gpu runs the perception workers (full profile only)"
    how: "A RunPod GPU pod, a lab machine or a cloud VM. Set HOST_SSH=user@host in backend/.env. Or HOST: local_mac (the hackathon profile)."
    check: env_host_ssh
  - id: iphone
    what: "An iPhone 16 Pro or Pro Max, developer mode on, connected to the Mac"
    why: "LiDAR, hi-res stills and ARKit do not run in the simulator"
    how: "Settings > Privacy & Security > Developer Mode on; plug in via USB; trust the computer; check `xcrun devicectl list devices`"
    check: device
  - id: apple_signing
    what: "Apple ID in Xcode with a development team for the RepairOS target"
    why: "The app must be signed to run on the phone. Q15 decided: free Apple ID sideload (7-day profile), no TestFlight."
    how: "Xcode > Settings > Accounts > add Apple ID; put DEVELOPMENT_TEAM in ios/Config/Signing.xcconfig (gitignored)."
    check: signing
  - id: multimeter
    what: "A multimeter with continuity (beep), DC volts and ohms"
    why: "The meter is the proof for every electrical fault (I2). Recorded sessions need real readings."
    how: "Any basic DMM. Note its continuity threshold (ohms) in session.json"
    check: none
  - id: test_products
    what: "The demo product on the table (Q1, picked at H0; two units if possible); later 3+ categories for evaluation"
    why: "Real captures of a real product; GEN2 sanity check on a unit not used for tuning (E8.6)"
    how: "Owner picks (Q1). Record it in samples/sessions/<id>/session.json. Never put product facts in code."
    check: none
  - id: polarised_light
    what: "Optional: cross-polarised ring light or polariser film pair"
    why: "Cuts glare for wire colour and connector checks (VF §11.2)"
    how: "Optional (Q17: no purchases needed)."
    check: none
  - id: license_decisions
    what: "LICENSE (Apache-2.0) and NOTICE in the repo (B0.1's output); the owner's licence decisions (Q18, Q-S1, Q-S2) recorded"
    why: "B0.5 writes the licence manifest; it needs the base licence files and the owner's decisions, not the manifest it creates"
    how: "Merge B0.1. Owner answers SPEC Q18 (emails) and Q-S1/Q-S2 (SpacetimeDB BSL fit, Maincloud terms, TypeScript bindings licence conflict)."
    check: license_base
  - id: release_licences
    what: "Finished licence set for a release: LICENSE, NOTICE and licenses/manifest.json (B0.5's output) present"
    why: "L1-L5 before the repo or an app build goes public (O9.4)"
    how: "Finish B0.5 (`python tools/license_check.py`), then commit licenses/manifest.json"
    check: license_manifest

# Global definition of done ("RepairOS works"). status.py marks each item met / not met.
# `requires` = card ids that must be done. `evidence` = a file that must exist (a measured result).
done_checklist:
  - id: D1
    text: "Scan any product with a cached reference and get aligned per-part findings, with insufficient_evidence where fit or coverage is missing"
    requires: [C1.4, C1.5, S2.1, S2.3, S2.4, S2.5, F4.8]
  - id: D2
    text: "Mode B close-ups give wire-check and connector findings with evidence crops and renders"
    requires: [I5.1, V3.4, V3.5]
  - id: D3
    text: "Fusion ranks suspects and picks the next action, with the selected fusion engine; words not numbers"
    requires: [F4.1, F4.3, F4.4]
  - id: D4
    text: "The meter wizard proves or clears an electrical fault by bisection; power state stated before probe points"
    requires: [F4.5, F4.6, I5.4]
  - id: D5
    text: "Grain cross-check runs against the real Grain API with schema validation and version pinning; the plan says when it was skipped"
    requires: [F4.7]
  - id: D6
    text: "Parts on hand get yes / yes_with_changes / no / need_simulation_check with S1-S5 in code; shopping is deterministic within budget"
    requires: [K6.1, K6.2, K6.3, K6.5]
  - id: D7
    text: "A validated RepairPlan (I2, S3) is shown with AR labels and confirmed by rescan or re-reading"
    requires: [K6.6, K6.7, I5.6, I5.2]
  - id: D8
    text: "Unknown product: reference built by a real Grain design turn, cached, design_trust=low, discovery mode; no harness degrades to discovery + symptom-driven meter guide"
    requires: [S2.3, V3.7]
  - id: D9
    text: "Generalisation measured: held-out categories at or above the gate; guard green (no product names, refs or provider names hard-coded)"
    requires: [B0.4, E8.1, E8.2, E8.3]
    evidence: eval/results/latest.json
  - id: D10
    text: "Calibration measured per product class; probabilities stay words until validated"
    requires: [E8.4]
    evidence: eval/results/calibration.json
  - id: D11
    text: "Safety suite green: polarity never from colour, protective parts no when unconfirmed, power state before probes"
    requires: [E8.5]
  - id: D12
    text: "Release ready: LICENSE, NOTICE, licence manifest green, no secrets on the phone, replay and dev-only providers locked out, evidence trail per scan"
    requires: [B0.5, O9.2, O9.3, O9.4]
  - id: D13
    text: "Live state: findings, suspects, next actions and plan appear on the phone as they are written, through the selected STATE implementation"
    requires: [S2.1]

cards:
  # ================================================================ P0 core
  - id: B0.1
    title: "Repo scaffold, Makefile, LICENSE, NOTICE, .gitignore"
    phase: P0
    track: demo
    phase1: true
    estimate_hours: 0.5
    owner_lane: L6
    owns: [Makefile, LICENSE, NOTICE, .gitignore, backend/pyproject.toml, backend/repairos/__init__.py, backend/README.md, ios/README.md, docs/CONTRIBUTING.md]
    human: [dev_tools, repo_access]
    estimate_days: 0.5
  - id: B0.2
    title: "Contract codegen: Pydantic v2 models, Swift Codable types and TypeScript types from spec/contracts"
    phase: P0
    track: demo
    phase1: true
    estimate_hours: 1.5
    owner_lane: L6
    depends_on: [B0.1]
    owns: [tools/codegen/**, backend/repairos/contracts/**, ios/RepairOS/Contracts/**, stdb/src/contracts/**]
    shared: [Makefile]
    contracts: [all]
    human: [dev_tools]
  - id: B0.3
    title: "CI: contracts, lint, unit tests, codegen drift, tasks.yaml sync, iOS build, PR template, CODEOWNERS"
    phase: P0
    track: later
    phase1: true
    depends_on: [B0.1]
    owns: [.github/workflows/ci.yml, .github/workflows/ios.yml, .github/CODEOWNERS, .github/pull_request_template.md, tools/check_tasks_sync.py]
    human: [repo_access]
  - id: B0.4
    title: "Generality guard: CI fails on hard-coded product names, refs, ids, class lists and provider names in core code"
    phase: P0
    track: later
    phase1: true
    depends_on: [B0.1]
    owns: [tools/generality_guard.py, tools/generality_guard.toml, backend/tests/unit/test_generality_guard.py]
