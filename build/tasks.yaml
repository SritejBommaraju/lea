# LEA task registry: the machine twin of PLAN.md §6-§7. Read by build/next.py, build/status.py, build/doctor.py.
#
# Format: strict YAML subset (build/_lib.py parses it, stdlib only): two-space indent, `key: value`, flow lists
# `[a, b]`, strings with ':' or '#' double-quoted, no multi-line scalars.
#
# Task fields: id, title, stream (app | modeling | build), phase (1), status (todo | doing | done | blocked | removed),
#   branch (for doing: where the work lives), removed (the task and its code were taken out; see PLAN.md),
#   depends_on, owns, human (ids from human_steps), slots (["SLOT=impl"] the task implements; the conformance
#   runner reads it), done_when.
# A task whose id leads a commit subject on main counts as done (squash-merge keeps the PR title).
# Phase 2 has no tasks yet: PLAN.md §9.

streams:
  - id: app
    name: "App (iOS)"
    file: areas/app.md
  - id: modeling
    name: "Modeling + benchmark"
    file: areas/modeling-benchmark.md
  - id: build
    name: "Build execution (Rohan + agents)"
    file: areas/build-execution.md

human_steps:
  - id: dev_tools
    what: "Python 3.12+, git, gh and Node 22+ on this machine"
    how: "brew install python@3.12 git gh node; then make bootstrap"
    check: tools_core
  - id: repo_access
    what: "gh logged in with access to the repo"
    how: "gh auth login"
    check: gh_auth
  - id: grain_key
    what: "GRAIN_URL and GRAIN_API_KEY in backend/.env (the design engine that judges scans)"
    how: "Owner creates a key for the design engine; put GRAIN_URL=... and GRAIN_API_KEY=... in backend/.env"
    check: env_grain
  - id: anthropic_key
    what: "ANTHROPIC_API_KEY in backend/.env (Lea's spoken answers)"
    how: "Owner creates the key; put ANTHROPIC_API_KEY=... in backend/.env"
    check: env_anthropic
  - id: xcode
    what: "Xcode 26 with Swift 6 on a Mac"
    how: "Install Xcode from the App Store, open it once, then xcode-select -s /Applications/Xcode.app"
    check: xcode
  - id: iphone
    what: "A LiDAR iPhone (16 Pro or Pro Max) connected, in developer mode"
    how: "Connect by cable, trust the Mac, turn on Settings > Privacy & Security > Developer Mode"
    check: device
  - id: apple_signing
    what: "ios/Config/Signing.xcconfig with DEVELOPMENT_TEAM (gitignored)"
    how: "A free Apple ID works; write DEVELOPMENT_TEAM = <team id> into ios/Config/Signing.xcconfig"
    check: signing
  - id: test_products
    what: "Real hardware to scan: several product kinds, some known good, some with known faults"
    how: "Collect them; keep a few products aside as held-out (never used for tuning)"
    check: none
  - id: multimeter
    what: "A multimeter for optional meter evidence"
    how: "Any DMM with continuity and DC volts"
    check: none

milestones:
  - id: MS2
    title: "Capture on device"
    requires: [A1, A2, A3, A4]
  - id: MS3
    title: "Report on the phone"
    requires: [A5, A6, B16]

tasks:
  # ---------------------------------------------------------------- App (iOS)
  - id: A1
    title: "App shell, device probe, pairing"
    stream: app
    phase: 1
    owns: [ios/RepairOS/App/**, ios/RepairOSTests/**]
    human: [xcode, iphone, apple_signing]
    done_when: "Builds and runs on a LiDAR iPhone; probes at startup whether 48 MP stills work inside the AR session; pairs with the gateway"
  - id: A2
    title: "LiDAR scan: own ARKit pipeline, mesh overlay, coverage heat map, keyframes, on-phone drift correction, coaching cues"
    stream: app
    phase: 1
    depends_on: [A1]
    owns: [ios/RepairOS/Capture/**]
    human: [iphone, test_products]
    done_when: "Any table-top object exports a valid scan-package (binary PLY in metres, poses, intrinsics, keyframe depth) with live coverage shown"
  - id: A3
    title: "Guided close-ups via captureHighResolutionFrame in the same AR session (48 MP when allowed, else 12 MP)"
    stream: app
    phase: 1
    depends_on: [A2]
    owns: [ios/RepairOS/Closeups/**]
    human: [iphone]
    done_when: "Every still is a valid still at full resolution with pose and intrinsics, linked to the scan; uncovered regions are shown"
  - id: A4
    title: "Upload: chunked, content-hashed, resumable"
    stream: app
    phase: 1
    depends_on: [A1]
    owns: [ios/RepairOS/Upload/**]
    done_when: "An upload cut mid-way finishes without re-sending done chunks; the gateway session passes make sessions-check"
  - id: A5
    title: "Report screen (live via SSE)"
    stream: app
    phase: 1
    depends_on: [A4, B16]
    owns: [ios/RepairOS/Report/**]
    done_when: "Renders verdict, findings with crops and confidence words, not_inspected, insufficient_evidence reasons; no probability numbers"
  - id: A6
    title: "Optional meter reading entry"
    stream: app
    phase: 1
    depends_on: [A5]
    owns: [ios/RepairOS/Meter/**]
    human: [multimeter]
    done_when: "Power state shown before probe points (S4); the sheet opens filled in from the report's next step; a reading shows the check it answered proven or ruled out"
  - id: A7
    title: "First-run usability pass"
    stream: app
    phase: 1
    depends_on: [A5]
    owns: [ios/RepairOS/**]
    human: [test_products]
    done_when: "People new to the app go from scan to report without help; what they hit is fixed or filed"
  - id: A8
    title: "No-LiDAR mode for any ARKit iPhone: world-tracking poses + guided stills; backend geometry when needed"
    stream: app
    phase: 1
    depends_on: [A2]
    owns: [ios/RepairOS/Capture/NoLidar/**]
    human: [iphone, test_products]
    done_when: "On a non-LiDAR iPhone a real object goes from scan to report; the report states what it cannot claim without depth"

  # ---------------------------------------------------------------- Modeling + benchmark
  - id: M1
    title: "Detector slot: OWLv2 default, Grounding DINO alternative, generic vocabulary, prompts, tiling"
    stream: modeling
    phase: 1
    status: removed
    owns: [none]
    done_when: "Removed 2026-10-28: the detector slot belonged to the Phase 1 pipeline (PLAN.md section 7)"
  - id: M2
    title: "Full-res crops from detector boxes"
    stream: modeling
    phase: 1
    status: removed
    owns: [none]
    done_when: "Removed 2026-10-28: crops belonged to the Phase 1 pipeline (PLAN.md section 7)"
  - id: M3
    title: "VLM crop checks and per-still inspection into findings"
    stream: modeling
    phase: 1
    status: removed
    owns: [none]
    done_when: "Removed 2026-10-28: the VLM crop checks belonged to the Phase 1 pipeline (PLAN.md section 7)"
  - id: M4
    title: "Benchmark data: labelled real sessions, known-good units, held-out products"
    stream: modeling
    phase: 1
    owns: [samples/sessions/**]
    human: [test_products, iphone]
    done_when: "make sessions-check passes; held-out products are never used for tuning or training"
  - id: M5
    title: "Benchmark runner make eval"
    stream: modeling
    phase: 1
    status: removed
    owns: [none]
    done_when: "Removed 2026-10-28: it scored the Phase 1 pipeline (PLAN.md section 7)"
  - id: M6
    title: "Defect dataset: licence-clean public data plus our labelled crops"
    stream: modeling
    phase: 1
    status: removed
    owns: [none]
    done_when: "Removed 2026-10-28: it fed the defect classifier (PLAN.md section 7)"
  - id: M7
    title: "Defect classifier, CLS slot: frozen DINOv2 + trained head, licence-clean data, benchmarked against Claude"
    stream: modeling
    phase: 1
    status: removed
    owns: [none]
    done_when: "Removed 2026-10-28: the classifier belonged to the Phase 1 pipeline (PLAN.md section 7)"
  - id: M8
    title: "OCR of labels and markings on crops"
    stream: modeling
    phase: 1
    status: removed
    owns: [none]
    done_when: "Removed 2026-10-28: OCR on detector crops belonged to the Phase 1 pipeline (PLAN.md section 7)"
  - id: M9
    title: "Detector choice measured on the benchmark"
    stream: modeling
    phase: 1
    status: removed
    owns: [none]
    done_when: "Removed 2026-10-28: it chose between detectors (PLAN.md section 7)"

  # ---------------------------------------------------------------- Build execution
  - id: B1
    title: "Scaffold, Makefile, guard and hook, build tools"
    stream: build
    phase: 1
    status: done
    owns: [Makefile, build/**, tools/guard_proprietary.py, tools/hooks/**]
    human: [dev_tools, repo_access]
    done_when: "Built"
  - id: B2
    title: "Contracts, codegen (Pydantic, Swift), check.py"
    stream: build
    phase: 1
    status: done
    depends_on: [B1]
    owns: [spec/contracts/**, tools/codegen/**, backend/repairos/contracts/**, ios/RepairOS/Contracts/**]
    done_when: "Built"
  - id: B3
    title: "Config, secrets, provider registry, release lockout"
    stream: build
    phase: 1
    status: done
    depends_on: [B1]
    owns: [backend/repairos/config.py, backend/repairos/registry.py, config/**, backend/.env.example]
    done_when: "Built"
  - id: B4
    title: "State (SQLite, invariant row rules) and blobs (local, content-addressed)"
    stream: build
    phase: 1
    status: done
    depends_on: [B3]
    owns: [backend/repairos/slots/state.py, backend/repairos/slots/state_sqlite/**, backend/repairos/slots/blob.py, backend/repairos/slots/blob_local/**]
    slots: [STATE=sqlite, BLOB=local]
    done_when: "Built"
  - id: B5
    title: "Gateway: pairing, resumable uploads, ingestion, reads, SSE"
    stream: build
    phase: 1
    status: done
    depends_on: [B2, B4]
    owns: [backend/repairos/api/**, backend/repairos/main.py]
    done_when: "Built"
  - id: B6
    title: "Recorded sessions and replay"
    stream: build
    phase: 1
    status: done
    depends_on: [B5]
    owns: [backend/repairos/sessions/**, tools/replay.py, samples/README.md, samples/session.schema.json]
    done_when: "Built"
  - id: B7
    title: "Fusion via Jev: word state, questions, suspects, next action in code, meter override"
    stream: build
    phase: 1
    status: removed
    owns: [none]
    done_when: "Removed 2026-10-28: fusion belonged to the Phase 1 pipeline (PLAN.md section 7)"
  - id: B8
    title: "LLM slot (Claude Sonnet)"
    stream: build
    phase: 1
    status: removed
    owns: [none]
    done_when: "Removed 2026-10-28: its only users were the Phase 1 report text and fusion (PLAN.md section 7)"
  - id: B9
    title: "report contract: verdict, findings with crop refs and confidence words, not_inspected, reasons"
    stream: build
    phase: 1
    depends_on: [B2]
    owns: [spec/contracts/report.schema.json, spec/contracts/examples/report*.json, spec/contracts/examples/invalid/report-*.json]
    done_when: "make contracts and make codegen-check pass; invalid examples show an uninspected region cannot be ok and insufficient_evidence needs a reason"
  - id: B10
    title: "Phase 1 pipeline orchestrator"
    stream: build
    phase: 1
    status: removed
    owns: [none]
    done_when: "Removed 2026-10-28: the Phase 1 pipeline was stripped (PLAN.md section 7)"
  - id: B11
    title: "Report generation: verdict in code, plain words by Claude, report route and SSE event"
    stream: build
    phase: 1
    status: removed
    owns: [none]
    done_when: "Removed 2026-10-28: the Phase 1 report builder was replaced by the design engine report (PLAN.md section 7)"
  - id: B12
    title: "Import fallback: Stray Scanner first; 3D Scanner App after a terms check"
    stream: build
    phase: 1
    depends_on: [B6]
    owns: [tools/import_capture.py, backend/tests/unit/test_import_capture.py]
    human: [test_products]
    done_when: "A real Stray Scanner export imports into a session that passes make sessions-check; no closed third-party app captures are used for training or benchmarking"
  - id: B13
    title: "Backend pose-graph refinement (loop closure) with Open3D and OpenCV, if on-phone drift correction falls short"
    stream: build
    phase: 1
    status: removed
    owns: [none]
    done_when: "Removed 2026-10-28: backend reconstruction was stripped with the Phase 1 pipeline (PLAN.md section 7)"
  - id: B14
    title: "CI: make check on every PR"
    stream: build
    phase: 1
    depends_on: [B1]
    owns: [.github/workflows/**]
    done_when: "Every PR shows the check; red blocks merge"
  - id: B15
    title: "Licence check of dependencies and weights against the L2 allowlist"
    stream: build
    phase: 1
    depends_on: [B14]
    owns: [tools/licence_check.py, licenses/weights.json]
    done_when: "Part of make check; fails on a disallowed licence"
  - id: B16
    title: "Design engine (Grain): client, report from its answer, readings, Fix it with Grain"
    stream: build
    phase: 1
    status: done
    depends_on: [B5]
    owns: [backend/repairos/grain/**, backend/repairos/report/from_grain.py, backend/repairos/api/**]
    human: [grain_key]
    done_when: "A completed scan is judged against the product's design and the report is built from the answer; readings go through the design engine; the customer can ask it to change the design from the phone"
