<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lea live</title>
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <main id="app" class="app" data-state="waiting">
    <header class="top">
      <div class="brand"><span class="mark" aria-hidden="true"></span>lea</div>
      <div class="status" id="status"><span class="dot"></span><span class="status-text">Connecting</span></div>
    </header>

    <section class="hero">
      <div class="eyebrow" id="phase">Waiting for a scan</div>
      <h1 class="looks"><span class="looks-label">Looks like</span> <span id="category" class="category">…</span></h1>
      <div class="sub" id="identity-sub"></div>
    </section>

    <section class="stage">
      <div class="viewport" id="viewport">
        <canvas id="three" aria-label="3D scan"></canvas>
        <div class="mosaic" id="mosaic"></div>
        <div class="viewport-note" id="viewport-note"></div>
      </div>

      <aside class="side">
        <div class="verdict" id="verdict" hidden>
          <div class="verdict-word" id="verdict-word"></div>
          <div class="verdict-text" id="verdict-text"></div>
        </div>
        <div class="counters">
          <div class="counter"><div class="num" id="n-stills">0</div><div class="label">photos</div></div>
          <div class="counter"><div class="num" id="n-checked">0</div><div class="label">areas checked</div></div>
          <div class="counter"><div class="num" id="n-unsure">0</div><div class="label">could not judge</div></div>
          <div class="counter accent"><div class="num" id="n-look">0</div><div class="label">to look at</div></div>
        </div>
        <div class="safety" id="safety"></div>
        <ol class="findings" id="findings"></ol>
      </aside>
    </section>

    <footer class="bottom">
      <div class="strip" id="strip"></div>
      <div class="meta" id="meta"></div>
    </footer>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
