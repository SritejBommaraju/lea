# Provider selection: config picks the implementation of every slot; code never does (PLAN.md §3).
#
# Read by backend/repairos/registry.py (runtime) and build/_lib.py (doctor, next, status). An implementation lives
# in backend/repairos/slots/<slot>_<impl>/. Override one slot from the shell: REPAIROS_SLOT_<SLOT>=<impl>
# (dev only; a release build refuses overrides). `none` = slot off; nothing is called.
# A change of default is a PLAN.md §10 decision row. Format: strict YAML subset, one `SLOT: impl` per line.

version: 3
updated: 2026-10-24

profile: phase1

profiles:
  phase1:
    DET: owlv2       # OWLv2 base, zero-shot (built). gdino = Grounding DINO tiny swap-in (built). M9 measures both
    VLM: anthropic   # Claude Haiku per crop, Sonnet on cannot_tell (built)
    LLM: anthropic   # Claude Sonnet for plain-word report text (built)
    FUSION: jev      # Jev judgments, decisions in code (built). No fallback: Jev down is a blocker
    CLS: none        # defect classifier, planned (M7); selected only after MS5
    OCRB: none       # label and marking OCR on crops, planned (M8)
    STATE: sqlite    # one SQLite file under data/ (built)
    BLOB: local      # content-addressed files under data/blobs/ (built)
    HOST: local_mac  # the dev laptop; dev only, a release build refuses it

# Phase 2 adds the GRAIN slot (Grain API client); see PLAN.md §9.
