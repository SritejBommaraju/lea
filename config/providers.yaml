# Provider selection: config picks the implementation of every slot; code never does (PLAN.md §3).
#
# Read by backend/repairos/registry.py (runtime) and build/_lib.py (doctor, next, status). An implementation lives
# in backend/repairos/slots/<slot>_<impl>/. Override one slot from the shell: REPAIROS_SLOT_<SLOT>=<impl>
# (dev only; a release build refuses overrides). `none` = slot off; nothing is called.
# A change of default is a PLAN.md §10 decision row. Format: strict YAML subset, one `SLOT: impl` per line.
#
# Scans are judged by the design engine (Grain, repairos.grain), which is not a slot: GRAIN_URL / GRAIN_API_KEY in
# backend/.env. The detection, classifier, VLM and fusion slots were removed with the Phase 1 pipeline (2026-10-28).

