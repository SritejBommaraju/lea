<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root { --paper: #fbfaf6; --ink: #1d2433; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1b1e24; --ink: #e8ebf1; } }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; color: var(--ink); background-size: 100% 100%; }
</style>
</head>
<body>
<svg id="board" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
<script src="vel-stage.js"></script>
<script>
  // Lea drives this page: play(steps) loads a lesson, step(i) draws step i and returns its drawing time in ms.
  let stage = null, steps = [];
  // opts.backdrop: a camera frame (data URL) drawn under the ink, filling a w x h drawing space.
  window.play = (lesson, opts = {}) => {
    steps = (lesson || []).map((s) => ({ say: String(s.say || ""), svg: String(s.svg || "").replace(/\bclass=(["'])tex\1/g, "") }));
    const svg = document.getElementById("board");
    svg.style.backgroundImage = opts.backdrop ? `url("${opts.backdrop}")` : "";
    svg.style.aspectRatio = opts.backdrop ? `${opts.w} / ${opts.h}` : "";
    stage = new window.VelStage(svg, { handDrawn: !opts.backdrop });
    stage.size(opts.w || 800, opts.h || 500);
    stage.clear();
    return steps.length;
  };
  window.step = (i) => {
    if (!stage || !steps[i]) return 0;
    try { return Number(stage.apply({ id: `step${i + 1}`, ...steps[i] }, true)) || 0; }
    catch (e) { return -1; }
  };
  window.inkCount = () => document.querySelectorAll("#board #vel-ink *").length;
</script>
</body>
</html>
