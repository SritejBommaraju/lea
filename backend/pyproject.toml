[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "repairos"
version = "0.1.0"
description = "RepairOS backend: gateway, workers, module slots"
license = "Apache-2.0"
requires-python = ">=3.12"
# Core deps only, pinned. Licences: pydantic MIT, pydantic-settings MIT, PyYAML MIT, jsonschema MIT.
# Full transitive pins: requirements.lock (`make lock`).
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    # Gateway (B5): fastapi MIT (starlette BSD-3, anyio MIT), uvicorn BSD-3 (h11 MIT, click BSD-3).
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
# pytest MIT. Codegen tools (datamodel-code-generator MIT, quicktype Apache-2.0) run through uvx / npx at a pinned
# version from tools/codegen and are not project dependencies.
dev = [
    "pytest==9.1.1",
]
# Phase 1 perception (M1, M3, B8): `uv pip install -e 'backend[vision]'`. Not in
# requirements.lock yet. Licences: transformers Apache-2.0, torch BSD-3-Clause (bundles Apache/BSD/MIT/BSL-1.0
# parts), pillow MIT-CMU (permissive), anthropic Apache-2.0 (MIT before 2.0.0), numpy
# BSD-3-Clause. Transitive tqdm is MPL-2.0 AND MIT: flag for the licence check (B15). Weights: Grounding DINO tiny
# and OWLv2 base, both Apache-2.0, revisions pinned in their slot packages.
vision = [
    "transformers==5.20.2",
    "torch==2.14.1",
    "pillow==13.0.0",
    "numpy==2.5.4",
    "anthropic==2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["repairos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
