[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "repairos"
version = "0.1.0"
description = "RepairOS backend: gateway, workers, module slots"
license = "Apache-2.0"
requires-python = ">=3.12"
# Core deps only, pinned. Licences: pydantic MIT, pydantic-settings MIT, PyYAML MIT, jsonschema MIT.
# Full transitive pins: requirements.lock (`make lock`).
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    # Gateway (B5): fastapi MIT (starlette BSD-3, anyio MIT), uvicorn BSD-3 (h11 MIT, click BSD-3).
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    # The design engine client (repairos.grain) and Cartesia: httpx2 (BSD-3), pinned as in requirements.lock.
    "httpx2==2.16.0",
    # Lea's answers (repairos.voice): anthropic Apache-2.0 (MIT before 2.0.0). Importers and the report export: numpy
    # BSD-3-Clause, pillow MIT-CMU (permissive).
    "anthropic==2.3.0",
    "numpy==2.5.4",
    "pillow==13.0.0",
]

[project.optional-dependencies]
# pytest MIT. Codegen tools (datamodel-code-generator MIT, quicktype Apache-2.0) run through uvx / npx at a pinned
# version from tools/codegen and are not project dependencies.
dev = [
    "pytest==9.1.1",
]

# Capture geometry (the importers' TSDF fusion): `uv pip install -e 'backend[geometry]'`. Not in requirements.lock.
# open3d MIT (wheel bundles its MIT/BSD/Apache 3rd-party code); its pip deps (dash, flask, werkzeug, nbformat,
# ipywidgets, configargparse and their tree) are MIT, BSD, Apache-2.0 or ISC, except transitive certifi, MPL-2.0: flag
# for the licence check (B15). Without it the importers fall back to a numpy voxel fusion.
geometry = [
    "open3d==0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["repairos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
